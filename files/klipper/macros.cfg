# Print start/end and best-effort power-loss recovery for the Ender 3 V2 + CR Touch clone.
# Orca calls: start PRINT_START BED=.. EXTRUDER=..; end PRINT_END;
# layer change PLR_SAVE LAYER=[layer_num] Z=[layer_z].

[gcode_macro _CLIENT_VARIABLE]
# mainsail.cfg's CANCEL_PRINT runs this just before CANCEL_PRINT_BASE
variable_user_cancel_macro: "PLR_CLEAR"
gcode:

[force_move]
# PLR_RESUME needs SET_KINEMATIC_POSITION (registered only when this is on)
enable_force_move: True

[save_variables]
filename: ~/printer_data/config/plr_variables.cfg

[gcode_macro PRINT_START]
description: Heat, home, adaptive mesh, purge (order tuned for a CR Touch clone)
gcode:
  {% set bed = params.BED|default(60)|float %}
  {% set extruder = params.EXTRUDER|default(210)|float %}
  PLR_CLEAR
  G90
  M83
  # home cold, then keep the CR Touch 50 mm above the bed while it heats:
  # parked 10 mm over a 65 C bed the clone pin sticks and the probe latches in alarm
  # G28 X Y lifts Z 10 mm first (safe_z_home z_hop), so the pin can be exercised
  # before its first real deploy: the clone pin sticks after sitting idle
  G28 X Y
  _PROBE_EXERCISE
  G28 Z
  G1 Z50 F600
  M140 S{bed}
  M190 S{bed}
  # the clone pin sticks on its first deploy after sitting idle: cycle it at Z50 first
  _PROBE_EXERCISE
  G28 Z
  # one sample per mesh point: halves CR Touch deploys (sticky clone pin, Timer too close exposure while probing)
  BED_MESH_CALIBRATE ADAPTIVE=1 SAMPLES=1
  G92 E0
  # mini purge at the home corner, outside the 220 mm print area
  G1 Z5 F600
  G1 X0 Y0 F6000
  M109 S{extruder}
  G1 E15 F150
  G1 E5 F300
  G1 E-1 F2400
  G4 S2
  G1 Z10 F600
  # wipe line along the front edge
  G1 X25 Y3 F6000
  G1 Z0.3 F600
  G1 E1 F2400
  G1 X75 Y3 E2.8 F1500
  G1 Z0.6 F600
  G92 E0

[gcode_macro PRINT_END]
description: Retract, lift, present the part, heaters and motors off
gcode:
  PLR_CLEAR
  G91
  G1 E-2 F2400
  G1 Z10 F600
  G90
  G1 X0 Y220 F6000
  M104 S0
  M140 S0
  M106 S0
  M84

[gcode_macro PLR_SAVE]
description: Save the resume point (Orca layer-change G-code)
gcode:
  {% set file = params.FILE|default(printer.print_stats.filename) %}
  {% set pos = params.POS|default(printer.virtual_sdcard.file_position)|int %}
  {% set z = params.Z|default(printer.gcode_move.gcode_position.z)|float %}
  {% if file and '%' not in file %}
    # Klipper splits parameters with shlex (posix): inside "..." only \ and "
    # are escapes, so escaping those two in the repr hands SAVE_VARIABLE the
    # exact Python literal for any name (spaces, quotes, ';', '#').
    # M23 in PLR_RESUME takes the raw rest of the line, so no decoding.
    SAVE_VARIABLE VARIABLE=plr_file VALUE="{file|pprint|replace('\\', '\\\\')|replace('"', '\\"')}"
    SAVE_VARIABLE VARIABLE=plr_pos VALUE={pos}
    SAVE_VARIABLE VARIABLE=plr_z VALUE={z}
    SAVE_VARIABLE VARIABLE=plr_layer VALUE={params.LAYER|default(0)|int}
    SAVE_VARIABLE VARIABLE=plr_bed VALUE={printer.heater_bed.target}
    SAVE_VARIABLE VARIABLE=plr_extruder VALUE={printer.extruder.target}
    SAVE_VARIABLE VARIABLE=plr_fan VALUE={printer.fan.speed}
    SAVE_VARIABLE VARIABLE=plr_active VALUE=True
  {% elif file and params.LAYER|default(0)|int <= 1 %}
    # save_variables writes through ConfigParser: a '%' raises and shuts
    # Klipper down, so such names get no resume point. Warn once, at the start.
    RESPOND TYPE=error MSG="PLR off for this print: rename the file without percent signs"
  {% endif %}

[gcode_macro PLR_CLEAR]
description: Forget the saved resume point
gcode:
  SAVE_VARIABLE VARIABLE=plr_active VALUE=False

[gcode_macro PLR_RESUME]
description: Resume the print saved by PLR_SAVE after a power loss (operator's OK first)
gcode:
  {% set v = printer.save_variables.variables %}
  {% if not v.plr_active|default(False) %}
    {action_raise_error("PLR: no interrupted print saved")}
  {% endif %}
  {% set z = v.plr_z|float %}
  M140 S{v.plr_bed}
  M104 S{v.plr_extruder}
  # trust the saved height: probing would crash into the part
  SET_KINEMATIC_POSITION Z={z}
  G91
  G1 Z5 F600
  G90
  G28 X Y
  M190 S{v.plr_bed}
  M109 S{v.plr_extruder}
  M106 S{(v.plr_fan * 255)|int}
  G1 Z{z} F600
  M83
  G92 E0
  M23 {v.plr_file}
  M26 S{v.plr_pos}
  M24

[gcode_macro _PROBE_EXERCISE]
description: Deploy and stow the CR Touch twice so a sticky pin moves before real probing
gcode:
  {% for i in range(2) %}
  BLTOUCH_DEBUG COMMAND=pin_down
  G4 P800
  BLTOUCH_DEBUG COMMAND=pin_up
  G4 P800
  {% endfor %}
  BLTOUCH_DEBUG COMMAND=reset
  G4 P500
